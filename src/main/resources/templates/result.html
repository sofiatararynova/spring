<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Студент</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="card">
    <h1>Информация о студенте</h1>

    <p th:text="'Id: ' + ${student.id}"></p>
    <p th:text="'Имя: ' + ${student.name}"></p>
    <p th:text="'Фамилия: ' + ${student.lastname}"></p>
    <p th:text="'Отчество: ' + ${student.patronomic}"></p>
    <p th:text="'E-mail: ' + ${student.email}"></p>
    <p th:text="'Год поступления: ' + ${student.year}"></p>
    <p th:text="'Группа: ' + ${student.group}"></p>
    <p th:text="'Логин: ' + ${student.login}"></p>

    <a href="/form" class="back-link">Ввести новую информацию</a>
</div>
</body>
</html>
