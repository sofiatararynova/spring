<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Новый студент</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<h1>Форма информации о студенте</h1>
<form action="#" th:action="@{/form}"
      th:object="${student}" method="post">
    <p>Id: <input type="text" th:field="*{id}" /></p>
    <p>Имя студента:
        <input type="text"
               placeholder="Введите имя"
               th:field="*{name}" /></p>
    <p>Фамилия студента:
        <input type="text"
               placeholder="Введите фамилию"
               th:field="*{lastname}" /></p>
    <p>Отчество студента:
        <input type="text"
               placeholder="Введите отчество"
               th:field="*{patronomic}" /></p>
    <p>Год поступления:
        <input type="number"
               placeholder="Введите год поступления"
               th:field="*{year}" /></p>
    <p>E-mail:
        <input type="email"
               placeholder="Введите e-mail"
               th:field="*{email}" /></p>
    <p><input type="submit" value="Отправить" />
        <input type="reset" value="Сброс" /></p>
</form>
</body> </html>
