<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Владельцы</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h1>Владельцы автомобилей</h1>
    <a th:href="@{/owners/create}" class="btn btn-primary mb-3">Добавить</a>
    <table class="table table-striped" th:if="${not #lists.isEmpty(owners)}">
        <thead class="table-dark">
        <tr><th>ID</th><th>Фамилия</th><th>Имя</th><th>Телефон</th><th>Марка</th><th>Номер</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="o : ${owners}">
            <td th:text="${o.id}"></td>
            <td th:text="${o.lastname}"></td>
            <td th:text="${o.name}"></td>
            <td th:text="${o.phone}"></td>
            <td th:text="${o.carBrand}"></td>
            <td th:text="${o.carNumber}"></td>
            <td>
                <a th:href="@{/owners/update/{id}(id=${o.id})}" class="btn btn-sm btn-warning">Изменить</a>
                <a th:href="@{/owners/delete/{id}(id=${o.id})}" class="btn btn-sm btn-danger">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(owners)}">Список пуст</p>
</div>
</body>
</html>
