<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm"><div class="card-body">
        <h1>Детали студента</h1>
        <ul class="list-group list-group-flush">
            <li class="list-group-item" th:text="'ID: ' + ${selectedStudent.id}"></li>
            <li class="list-group-item" th:text="'Фамилия: ' + ${selectedStudent.lastname}"></li>
            <li class="list-group-item" th:text="'Имя: ' + ${selectedStudent.name}"></li>
            <li class="list-group-item" th:text="'Отчество: ' + ${selectedStudent.patronomic}"></li>
            <li class="list-group-item" th:text="'E-mail: ' + ${selectedStudent.email}"></li>
            <li class="list-group-item" th:text="'Год: ' + ${selectedStudent.year}"></li>
            <li class="list-group-item" th:text="'Группа: ' + ${selectedStudent.group}"></li>
            <li class="list-group-item" th:text="'Логин: ' + ${selectedStudent.login}"></li>
        </ul>
        <a th:href="@{/institut}" class="btn btn-secondary mt-3">Назад</a>
    </div></div>
</div>
</body>
</html>
