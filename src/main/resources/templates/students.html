<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Институт</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h1>Институт</h1>
    <a th:href="@{/create}" class="btn btn-primary mb-3">Добавить</a>

    <p th:if="${students == null or !students.iterator().hasNext()}">Список пуст</p>

    <table th:if="${students != null and students.iterator().hasNext()}"
           class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Фамилия</th>
            <th>Имя</th>
            <th>Отчество</th>
            <th>E-mail</th>
            <th>Год</th>
            <th>Группа</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.lastname}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.patronomic}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.year}"></td>
            <td th:text="${s.group}"></td>
            <td>
                <a th:href="@{/details/{id}(id=${s.id})}"
                   class="btn btn-sm btn-secondary">Детали</a>
                <a th:href="@{/update/{id}(id=${s.id})}"
                   class="btn btn-sm btn-warning">Изменить</a>
                <a th:href="@{/delete/{id}(id=${s.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Удалить?')">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
