<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Владелец</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm"><div class="card-body">
        <h1>Данные владельца</h1>
        <form th:action="@{/owners/save}" th:object="${owner}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3"><label class="form-label">Фамилия</label><input type="text" class="form-control" th:field="*{lastname}"/></div>
            <div class="mb-3"><label class="form-label">Имя</label><input type="text" class="form-control" th:field="*{name}"/></div>
            <div class="mb-3"><label class="form-label">Отчество</label><input type="text" class="form-control" th:field="*{patronymic}"/></div>
            <div class="mb-3"><label class="form-label">Телефон</label><input type="text" class="form-control" th:field="*{phone}"/></div>
            <div class="mb-3"><label class="form-label">Марка авто</label><input type="text" class="form-control" th:field="*{carBrand}"/></div>
            <div class="mb-3"><label class="form-label">Номер авто</label><input type="text" class="form-control" th:field="*{carNumber}"/></div>
            <div class="mb-3"><label class="form-label">Номер техпаспорта</label><input type="text" class="form-control" th:field="*{techPassport}"/></div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/owners/main}" class="btn btn-secondary">Отмена</a>
        </form>
    </div></div>
</div>
</body>
</html>
