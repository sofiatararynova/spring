<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Студент</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm"><div class="card-body">
        <h1>Данные студента</h1>
        <form th:action="@{/update}" th:object="${student}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label">Фамилия</label>
                <input type="text" class="form-control" th:field="*{lastname}"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Имя</label>
                <input type="text" class="form-control" th:field="*{name}"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Отчество</label>
                <input type="text" class="form-control" th:field="*{patronomic}"/>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" th:field="*{email}"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Год поступления</label>
                <input type="number" class="form-control" th:field="*{year}"/>
            </div>

            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/institut}" class="btn btn-secondary">Отмена</a>
        </form>
    </div></div>
</div>
</body>
</html>
